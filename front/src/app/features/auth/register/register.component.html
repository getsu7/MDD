<div class="auth-page">
  <header class="auth-page__header">
    <app-back-button fallback="/"></app-back-button>
  </header>

  <main class="auth-page__content">
    <img src="assets/logo_p6.png" alt="MDD — Monde de Dev" class="auth-page__logo" />
    <h1 class="auth-page__title">Inscription</h1>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="mdd-field">
        <span class="mdd-field__label">Nom d'utilisateur</span>
        <span class="mdd-field__control">
          <input
            class="mdd-field__input"
            formControlName="username"
            autocomplete="username"
            required
          />
        </span>
        <span class="mdd-field__error" *ngIf="form.controls.username.hasError('required') && form.controls.username.touched">
          Le nom d'utilisateur est obligatoire.
        </span>
        <span class="mdd-field__error" *ngIf="form.controls.username.hasError('minlength')">
          Le nom d'utilisateur doit contenir au moins 3 caractères.
        </span>
        <span class="mdd-field__error" *ngIf="form.controls.username.hasError('maxlength')">
          Le nom d'utilisateur ne peut pas dépasser 100 caractères.
        </span>
      </label>

      <label class="mdd-field">
        <span class="mdd-field__label">Adresse e-mail</span>
        <span class="mdd-field__control">
          <input
            class="mdd-field__input"
            type="email"
            formControlName="email"
            autocomplete="email"
            required
          />
        </span>
        <span class="mdd-field__error" *ngIf="form.controls.email.hasError('required') && form.controls.email.touched">
          L'adresse e-mail est obligatoire.
        </span>
        <span class="mdd-field__error" *ngIf="form.controls.email.hasError('email')">
          Format d'adresse e-mail invalide.
        </span>
      </label>

      <label class="mdd-field">
        <span class="mdd-field__label">Mot de passe</span>
        <span class="mdd-field__control">
          <input
            class="mdd-field__input"
            type="password"
            formControlName="password"
            autocomplete="new-password"
            required
          />
        </span>
        <span
          [class]="
            form.controls.password.invalid && form.controls.password.touched
              ? 'mdd-field__error'
              : 'mdd-field__hint'
          "
        >
          {{ passwordHint }}
        </span>
      </label>

      <p class="auth-form__error" *ngIf="serverError" role="alert">
        {{ serverError }}
      </p>

      <button
        mat-raised-button
        color="primary"
        type="submit"
        class="auth-form__submit"
        [disabled]="submitting"
      >
        <mat-spinner *ngIf="submitting" diameter="20"></mat-spinner>
        <span *ngIf="!submitting">S'inscrire</span>
      </button>

      <p class="auth-form__switch">
        Déjà un compte ? <a routerLink="/login">Se connecter</a>
      </p>
    </form>
  </main>
</div>
