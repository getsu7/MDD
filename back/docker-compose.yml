services:
  mysql:
    image: mysql:8.4
    container_name: mdd-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-mdd}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-mdd_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mdd_password}
    ports:
      - "3306:3306"
    volumes:
      - mdd_mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mdd_mysql_data:

