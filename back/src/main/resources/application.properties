# Application
spring.application.name=mdd-api
server.port=8080

spring.config.import=optional:file:.env[.properties]

# Datasource MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mdd}
spring.datasource.username=${DB_USERNAME:mdd_user}
spring.datasource.password=${DB_PASSWORD:mdd_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Options du driver MySQL (hors URL pour garder un .env sans caractère '&')
spring.datasource.hikari.data-source-properties.useSSL=false
spring.datasource.hikari.data-source-properties.allowPublicKeyRetrieval=true
spring.datasource.hikari.data-source-properties.serverTimezone=UTC

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET_KEY}
jwt.expiration=86400
jwt.issuer=mdd-api

# CORS (front Angular)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
